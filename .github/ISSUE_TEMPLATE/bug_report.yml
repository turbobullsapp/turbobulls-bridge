name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Two things first:
        - **Never paste an API key**, not even a revoked one, and no screenshot that shows one.
        - A **security problem** goes to the Security tab (Report a vulnerability), never to an issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Run `turbobulls-bridge --version`, or the image tag you run.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: runs
    attributes:
      label: How you run it
      options: [npx, Installed with npm, Docker]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer
      description: Operating system and Node.js version (`node --version`).
      placeholder: macOS 15, Node.js 24.1
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Firefox, Chrome, Edge, Brave, Other]
  - type: dropdown
    id: source
    attributes:
      label: Data source
      options: [EODHD, Twelve Data, Alpha Vantage, Finnhub, A source of my own, Not about a source]
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Messages shown, word for word.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
      placeholder: |
        1. ...
        2. ...
